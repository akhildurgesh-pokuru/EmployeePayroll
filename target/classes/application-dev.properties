
# UC-3: Development Environment

environment=DEV

# Logging levels
logging.level.root=INFO
logging.level.com.bridgelabz.employeepayroll=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Development logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Console logging enabled
spring.main.banner-mode=console

# Show SQL statements during development
spring.jpa.show-sql=true
