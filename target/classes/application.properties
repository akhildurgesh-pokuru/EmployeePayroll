
spring.application.name=employee-payroll-app

server.port=8080

# Default profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MySQL database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/employees
spring.datasource.username=root
spring.datasource.password=Vishruth45

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Hibernate logging
logging.level.org.hibernate.SQL=WARN

# UC-2: Logging configuration

logging.level.root=INFO
logging.level.com.bridgelabz.employeepayroll=DEBUG

# Console log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Application log file
logging.file.name=logs/employee-payroll.log

