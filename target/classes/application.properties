
spring.application.name=employee-payroll-app

server.port=8080

# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:payroll_db}

spring.datasource.username=${PAYROLL_DB_USERNAME:payrolluser}

spring.datasource.password=${PAYROLL_DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Hibernate Logging
logging.level.org.hibernate.SQL=WARN
