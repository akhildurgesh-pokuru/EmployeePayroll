environment=PROD

# Production logging
logging.level.root=WARN
logging.level.com.bridgelabz=INFO

# Reduce SQL output
spring.jpa.show-sql=false

# Logging to file
logging.file.name=logs/employee-payroll.log

# Log pattern
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Database schema changes must be managed separately
spring.jpa.hibernate.ddl-auto=validate
