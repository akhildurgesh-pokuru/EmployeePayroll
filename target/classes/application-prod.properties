
# UC-3: Production Environment

environment=PROD

# Logging levels
logging.level.root=WARN
logging.level.com.bridgelabz.employeepayroll=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR

# Logging to file
logging.file.name=logs/employee-payroll.log

# Production file logging pattern
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Disable console log output
logging.pattern.console=

# Disable SQL output
spring.jpa.show-sql=false

# Validate database schema in production
spring.jpa.hibernate.ddl-auto=validate

# Disable startup banner
spring.main.banner-mode=off
